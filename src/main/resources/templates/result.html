<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Beyza Diş Kliniği - Kayıt Sonucu</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root{
          --khaki: #7a7a49;
          --khaki-soft: #eef0e6;
          --ink: #1f2328;
        }
        body{ background: #f6f7f4; color: var(--ink); }
        .top-accent{
          height: 4px;
          background: linear-gradient(90deg, var(--khaki), #a4a46a, var(--khaki));
        }
        .card-soft{
          border: 1px solid rgba(0,0,0,.06);
          border-radius: 16px;
        }
        .shadow-lite{ box-shadow: 0 10px 30px rgba(0,0,0,.06); }
        .badge-soft{
          background: var(--khaki-soft);
          color: var(--khaki);
          border: 1px solid rgba(122,122,73,.25);
        }
        .logo{
          width: 34px; height: 34px;
          display: inline-flex;
          align-items: center;
          justify-content: center;
          border-radius: 12px;
          background: var(--khaki-soft);
          border: 1px solid rgba(122,122,73,.25);
        }
        .khaki-outline{
          border-color: rgba(122,122,73,.55);
          color: var(--khaki);
        }
        .khaki-outline:hover{
          background: var(--khaki-soft);
          border-color: rgba(122,122,73,.75);
          color: var(--khaki);
        }
    </style>
</head>

<body>
<div class="top-accent"></div>

<nav class="navbar bg-white border-bottom">
    <div class="container py-2">
        <div class="d-flex align-items-center gap-3">
            <div class="logo" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                    <path d="M7.5 4.8c1.2-1 2.7-1.6 4.5-1.6s3.3.6 4.5 1.6c1.7 1.4 2.4 3.6 1.9 5.8-.5 2.1-1.4 4-2 6.1-.4 1.4-.6 2.7-1.9 2.7-1 0-1.2-1.1-1.4-2.2-.2-1.2-.4-2.4-1.1-2.4s-.9 1.2-1.1 2.4c-.2 1.1-.4 2.2-1.4 2.2-1.3 0-1.5-1.3-1.9-2.7-.6-2.1-1.5-4-2-6.1-.5-2.2.2-4.4 1.9-5.8Z"
                          stroke="rgba(122,122,73,.95)" stroke-width="1.8"/>
                </svg>
            </div>

            <div>
                <div class="fw-bold fs-5">
                    Beyza <span style="color: var(--khaki);">Diş Kliniği</span>
                </div>
                <div class="text-muted small">Hasta Kayıt Sistemi</div>
            </div>
        </div>

        <span class="badge badge-soft rounded-pill px-3 py-2">Kayıt Tamam</span>
    </div>
</nav>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-9 col-lg-6">

            <div class="card card-soft shadow-lite">
                <div class="card-body p-4 p-md-5">

                    <div class="alert border-0" style="background: var(--khaki-soft);">
                        <div class="fw-semibold" style="color: var(--khaki);">✅ Hasta kaydı başarıyla oluşturuldu</div>
                        <div class="text-muted small">Aşağıdaki bilgiler sistemde görünecek şekilde hazırlandı.</div>
                    </div>

                    <h4 class="mb-3">Kayıt Özeti</h4>

                    <div class="list-group mb-4">

                        <div class="list-group-item d-flex justify-content-between align-items-center">
                            <span class="text-muted">Hasta No</span>
                            <span class="fw-semibold" th:text="${patient.patientNo}"></span>
                        </div>

                        <div class="list-group-item d-flex justify-content-between align-items-center">
                            <span class="text-muted">Ad</span>
                            <span class="fw-semibold" th:text="${patient.name}"></span>
                        </div>

                        <div class="list-group-item d-flex justify-content-between align-items-center">
                            <span class="text-muted">Soyad</span>
                            <span class="fw-semibold" th:text="${patient.surname}"></span>
                        </div>

                        <div class="list-group-item d-flex justify-content-between align-items-center">
                            <span class="text-muted">Telefon</span>
                            <span class="fw-semibold" th:text="${patient.phoneNumber}"></span>
                        </div>

                        <div class="list-group-item d-flex justify-content-between align-items-center">
                            <span class="text-muted">Email</span>
                            <span class="fw-semibold" th:text="${patient.email}"></span>
                        </div>
                    </div>

                    <!-- 🔥 BUTONLAR EKLENDİ -->
                    <div class="d-grid gap-2">
                        <a class="btn khaki-outline rounded-3 py-2" href="/register">Yeni Kayıt Oluştur</a>
                        <a class="btn khaki-outline rounded-3 py-2" href="/patients">Kayıtları Gör</a>
                    </div>

                </div>
            </div>

            <div class="text-center mt-4 small text-muted">
                © <span class="fw-semibold">Beyza Diş Kliniği</span> • Basit Demo
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
