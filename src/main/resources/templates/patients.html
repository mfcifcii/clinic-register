<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Beyza Diş Kliniği - Kayıt Listesi</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root{
          --khaki: #7a7a49;
          --khaki-soft: #eef0e6;
          --ink: #1f2328;
        }
        body{ background: #f6f7f4; color: var(--ink); }
        .top-accent{
          height: 4px;
          background: linear-gradient(90deg, var(--khaki), #a4a46a, var(--khaki));
        }
        .badge-soft{
          background: var(--khaki-soft);
          color: var(--khaki);
          border: 1px solid rgba(122,122,73,.25);
        }
        .card-soft{
          border: 1px solid rgba(0,0,0,.06);
          border-radius: 16px;
        }
        .shadow-lite{ box-shadow: 0 10px 30px rgba(0,0,0,.06); }
        .khaki-outline{
          border-color: rgba(122,122,73,.55);
          color: var(--khaki);
        }
        .khaki-outline:hover{
          background: var(--khaki-soft);
          border-color: rgba(122,122,73,.75);
          color: var(--khaki);
        }
    </style>
</head>

<body>
<div class="top-accent"></div>

<nav class="navbar bg-white border-bottom">
    <div class="container py-2 d-flex justify-content-between align-items-center">
        <div>
            <div class="fw-bold fs-5">Beyza <span style="color: var(--khaki);">Diş Kliniği</span></div>
            <div class="text-muted small">Hasta Kayıt Sistemi</div>
        </div>
        <span class="badge badge-soft rounded-pill px-3 py-2">
      Toplam Kayıt: <span th:text="${#lists.size(patients)}"></span>
    </span>
    </div>
</nav>

<div class="container py-5">
    <div class="card card-soft shadow-lite">
        <div class="card-body p-4 p-md-5">

            <div class="d-flex justify-content-between align-items-center mb-3">
                <h3 class="mb-0">Kayıt Listesi</h3>
                <a class="btn khaki-outline rounded-3" href="/register">+ Yeni Kayıt</a>
            </div>

            <div class="table-responsive">
                <table class="table align-middle">
                    <thead>
                    <tr class="text-muted">
                        <th>Hasta No</th>
                        <th>Ad</th>
                        <th>Soyad</th>
                        <th>Telefon</th>
                        <th>Email</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="p : ${patients}">
                        <td class="fw-semibold" th:text="${p.patientNo}"></td>
                        <td th:text="${p.name}"></td>
                        <td th:text="${p.surname}"></td>
                        <td th:text="${p.phoneNumber}"></td>
                        <td th:text="${p.email}"></td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(patients)}">
                        <td colspan="5" class="text-center text-muted py-4">
                            Henüz kayıt yok. “Yeni Kayıt” ile başlayın.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
